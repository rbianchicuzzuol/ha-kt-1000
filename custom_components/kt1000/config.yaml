name: KT-1000
version: "0.11.0"
slug: kt1000
description: Controle de acesso KT-1000 pela Tuya Cloud
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:door-closed-lock
panel_title: KT-1000
ports:
  8100/tcp: null
ports_description:
  8100/tcp: API de leitura para a ponte (rede interna; não é necessário expor)
options:
  bridge_token: ""
  client_id: ""
  client_secret: ""
  device_id: ""
  region: us
  title: KT-1000
  scan_interval: 30
  remote_unlock_enabled: false
  remote_unlock_mode: open_door
schema:
  bridge_token: password
  client_id: str
  client_secret: password
  device_id: str
  region: list(us|eu|cn|in)
  title: str
  scan_interval: int(30,3600)
  remote_unlock_enabled: bool
  remote_unlock_mode: list(open_door|door_operate)
